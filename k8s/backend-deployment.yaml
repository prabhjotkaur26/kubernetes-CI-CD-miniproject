apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kubedeploy

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: backend-sa
      containers:
      - name: backend
        image: prabhjotkaur9009/backend:v10

        ports:
        - containerPort: 5000

        livenessProbe:
          httpGet:
            path: /health
            port: 5000

        readinessProbe:
          httpGet:
            path: /health
            port: 5000