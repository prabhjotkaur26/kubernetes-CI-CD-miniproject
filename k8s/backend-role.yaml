apiVersion: v1
kind: ServiceAccount

metadata:
  name: backend-sa
  namespace: kubedeploy

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  namespace: kubedeploy
  name: backend-role

rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]

- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: backend-rolebinding
  namespace: kubedeploy

subjects:
- kind: ServiceAccount
  name: backend-sa
  namespace: kubedeploy

roleRef:
  kind: Role
  name: backend-role
  apiGroup: rbac.authorization.k8s.io