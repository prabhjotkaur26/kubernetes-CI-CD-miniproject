name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: |
          docker build -t prabhjotkaur9009/frontend:v1 ./frontend

      - name: Build Backend Image
        run: |
          docker build -t prabhjotkaur9009/backend:v1 ./backend

      - name: Push Frontend Image
        run: |
          docker push prabhjotkaur9009/frontend:v1

      - name: Push Backend Image
        run: |
          docker push prabhjotkaur9009/backend:v1
