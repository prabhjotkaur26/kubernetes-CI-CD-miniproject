<!DOCTYPE html>
<html>

<head>
    <title>Kubernetes Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Kubernetes Monitoring Dashboard</h1>

<div class="container">

    <button onclick="loadPods()">
        Load Pods
    </button>

    <button onclick="loadServices()">
        Load Services
    </button>

    <button onclick="loadDeployments()">
        Load Deployments
    </button>

    <div id="output"></div>

</div>

<script>

const API = "http://localhost:5000";

async function loadPods() {

    const response =
        await fetch(`${API}/pods`);

    const data =
        await response.json();

    let html = "<h2>Pods</h2>";

    data.forEach(pod => {

        html += `
            <p>
                ${pod.name}
                -
                ${pod.status}
            </p>
        `;
    });

    document.getElementById('output').innerHTML =
        html;
}

async function loadServices() {

    const response =
        await fetch(`${API}/services`);

    const data =
        await response.json();

    let html = "<h2>Services</h2>";

    data.forEach(service => {

        html += `
            <p>${service.name}</p>
        `;
    });

    document.getElementById('output').innerHTML =
        html;
}

async function loadDeployments() {

    const response =
        await fetch(`${API}/deployments`);

    const data =
        await response.json();

    let html = "<h2>Deployments</h2>";

    data.forEach(dep => {

        html += `
            <p>
                ${dep.name}
                -
                Replicas:
                ${dep.replicas}
            </p>
        `;
    });

    document.getElementById('output').innerHTML =
        html;
}

</script>

</body>
</html>
